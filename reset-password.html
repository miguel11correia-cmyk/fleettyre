<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Repor password · FleetTyre</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@1,800;1,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<meta name="theme-color" content="#E7101A">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192-v2.png">
</head>
<body>

<div class="login-screen" style="justify-content:center">
  <div class="login-logo-top">
    <img src="assets/logo-vertical.png" alt="FleetTyre" style="object-fit:contain">
  </div>

  <div class="login-box" style="margin:0 auto">
    <div id="rp-form">
      <div class="frow"><label>Nova password</label><input type="password" id="rp-nova" placeholder="••••••••" autocomplete="new-password"></div>
      <div class="frow"><label>Confirmar nova password</label><input type="password" id="rp-confirmar" placeholder="••••••••" autocomplete="new-password"></div>
      <button class="btn btn-brand w100" id="rp-btn" onclick="guardarNovaPassword()">Guardar nova password</button>
      <p id="rp-erro" class="err-msg"></p>
    </div>
    <div id="rp-sucesso" class="hidden" style="text-align:center">
      <p style="font-weight:600;color:var(--green)">Password alterada com sucesso.</p>
      <p style="font-size:13px;color:var(--text3);margin-top:6px">Podes fechar este separador e voltar à app.</p>
      <p style="margin-top:14px"><a href="app.html" style="font-size:12px;color:var(--text3)">Ou entrar na app por aqui →</a></p>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = window.__SUPABASE_URL__;
const SUPABASE_KEY = window.__SUPABASE_KEY__;
// Chave de storage própria + sem persistir em localStorage: esta página é
// descartável (uma acção e pronto), por isso a sessão do link de
// recuperação/convite fica só na memória desta aba. Sem isto, ela partilha
// o storage com a app principal — e o signOut() no fim desta página (ver
// guardarNovaPassword) propagava-se via localStorage/BroadcastChannel e
// desligava também um separador da app que já estivesse aberto e autenticado.
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    storageKey: 'ft-reset-password',
    persistSession: false,
    autoRefreshToken: false,
  },
});

const erroEl = document.getElementById('rp-erro');
let sessaoPronta = false;

// O link de recuperação dispara este evento assim que o Supabase valida o
// token do URL e cria uma sessão temporária — só a partir daqui é seguro
// chamar updateUser(). Um link já expirado/usado nunca dispara isto.
sb.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') sessaoPronta = true;
});

// Links expirados ou já usados voltam com "#error=...&error_description=..."
// em vez de um token válido — avisa logo, sem esperar pelo submit.
(function verificarErroNoLink() {
  const params = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  if (params.get('error')) {
    erroEl.textContent = 'Este link expirou ou já foi utilizado. Pede um novo link de recuperação na app.';
    document.getElementById('rp-btn').disabled = true;
  }
})();

async function guardarNovaPassword() {
  erroEl.textContent = '';

  if (!sessaoPronta) {
    erroEl.textContent = 'Link inválido ou expirado. Pede um novo link de recuperação na app.';
    return;
  }

  const nova      = document.getElementById('rp-nova').value;
  const confirmar = document.getElementById('rp-confirmar').value;

  if (!nova || nova.length < 6) { erroEl.textContent = 'A password tem de ter pelo menos 6 caracteres.'; return; }
  if (nova !== confirmar) { erroEl.textContent = 'As passwords não coincidem.'; return; }

  document.getElementById('rp-btn').disabled = true;
  const { error } = await sb.auth.updateUser({ password: nova });

  if (error) {
    erroEl.textContent = 'Erro: ' + error.message;
    document.getElementById('rp-btn').disabled = false;
    return;
  }

  // Esta sessão só serviu para confirmar o link — não faz sentido deixá-la
  // activa numa aba que a pessoa vai fechar a seguir.
  await sb.auth.signOut();
  document.getElementById('rp-form').classList.add('hidden');
  document.getElementById('rp-sucesso').classList.remove('hidden');
}
</script>

</body>
</html>
